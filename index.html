<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F4F5F8">
<title>测测你是奶龙家族的谁 | 奶蛙、奶蛋、小奶蛙、奶鼠、奶狗、奶豆、奶鸡、奶屎还是奶茶？</title>
<style>:root{--bg:#F4F5F8;--ink:#333A45;--ink2:#6B7688;--ink3:#A5AEBD;--line:#ECEDF2;--amber:#F5A623;--amber-d:#D98E0F;--amber-bg:#FFF8E8;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Source Han Sans SC","Microsoft YaHei",sans-serif;font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;display:flex;justify-content:center;padding:26px 14px 46px;min-height:100vh;}
.wrap{width:100%;max-width:420px;position:relative;}
.card{background:#fff;border-radius:22px;box-shadow:0 6px 32px rgba(40,50,80,.08);padding:32px 26px 28px;text-align:center;}
.hidden{display:none;}
.page{animation:pop .28s ease;}
@keyframes pop{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.page{animation:none}.bar i{transition:none}}
.badge{width:78px;height:78px;margin:0 auto 14px;border-radius:50%;background:#FFF3D6;display:flex;align-items:center;justify-content:center;}
.badge img{width:60px;height:60px;object-fit:contain;filter:drop-shadow(0 3px 8px rgba(40,50,80,.18));}
h1{font-size:24px;font-weight:800;line-height:1.45;margin:0 0 6px;letter-spacing:1px;}
.sub{font-size:13px;color:var(--ink3);margin:0 0 18px;}
.zoo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 10px;}
.z{background:#FAFBFD;border:1px solid #F0F1F5;border-radius:14px;padding:9px 4px 6px;position:relative;}
.z img{width:46px;height:46px;object-fit:contain;display:block;margin:0 auto;}
.z b{display:block;font-size:10.5px;color:var(--ink2);font-weight:600;margin-top:2px;}
.z .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;}
.legend{font-size:11px;color:var(--ink3);margin:0 0 16px;}
.legend i{font-style:normal;display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 1px 0 6px;vertical-align:1px;}
.intro{font-size:13.5px;color:var(--ink2);line-height:1.85;text-align:left;margin:0 0 20px;}
.btn-p{width:100%;padding:15px;border:0;border-radius:14px;background:var(--amber);color:#fff;font-size:16px;font-weight:700;cursor:pointer;font-family:inherit;letter-spacing:2px;}
.btn-p:active{transform:translateY(1px);background:var(--amber-d);}
.note{font-size:11px;color:#B7BFCC;margin:14px 0 0;}
.q-head{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);letter-spacing:1.5px;}
.bar{height:4px;background:#F0F1F5;border-radius:2px;margin:10px 0 20px;overflow:hidden;}
.bar i{display:block;height:100%;background:var(--amber);border-radius:2px;transition:width .3s;}
.q-title{font-size:17.5px;font-weight:700;text-align:left;margin:0 0 18px;}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:13px 14px;margin-bottom:10px;background:#fff;border:1.5px solid var(--line);border-radius:14px;font-size:14px;color:var(--ink);cursor:pointer;font-family:inherit;line-height:1.5;}
.opt .k{flex:0 0 24px;height:24px;border-radius:50%;background:#F4F5F8;color:var(--ink3);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.opt.on{border-color:#F5C463;background:var(--amber-bg);}
.opt.on .k{background:var(--amber);color:#fff;}
.q-foot{display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.link-btn{background:none;border:0;color:var(--ink3);font-size:13px;cursor:pointer;font-family:inherit;padding:6px;}
.milk-hero{margin:2px 0 6px;}
.milk-hero img{width:140px;height:140px;object-fit:contain;filter:drop-shadow(0 5px 14px rgba(40,50,80,.16));}
.r-kicker{font-size:10px;letter-spacing:3.5px;color:#B7BFCC;}
.r-name{font-size:34px;font-weight:800;letter-spacing:2px;margin:2px 0 2px;}
.r-en{font-size:11px;color:#B7BFCC;letter-spacing:2.5px;margin-bottom:12px;}
.r-tags span{display:inline-block;font-size:12px;padding:4px 12px;border-radius:999px;background:var(--amber-bg);color:#C98A1E;margin:0 3px 6px;}
.r-hl{font-size:21px;font-weight:800;line-height:1.5;letter-spacing:.5px;margin:18px 0 9px;}
.r-punch{font-size:13.5px;color:var(--ink3);line-height:1.7;margin:0 0 4px;}
.heat{margin:16px 0 18px;padding:14px 16px 12px;background:#FAFBFD;border:1px solid #F0F1F5;border-radius:14px;text-align:left;}
.heat-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
.heat-head span{font-size:10.5px;letter-spacing:1px;color:var(--ink3);}
.heat-head b{font-size:13px;font-weight:700;color:var(--ink);white-space:nowrap;}
.heat-bar{position:relative;height:10px;border-radius:6px;margin:17px 4px 11px;background:linear-gradient(90deg,#A9C2E8 0%,#C8D9C4 20%,#E8D98C 40%,#F5B93C 60%,#F0872E 80%,#E8543F 100%);}
.heat-pin{position:absolute;top:50%;left:50%;width:16px;height:16px;border-radius:50%;background:#fff;border:4px solid #333A45;transform:translate(-50%,-50%);box-shadow:0 2px 5px rgba(40,50,80,.25);}
.heat-scale{position:relative;height:15px;font-size:10px;color:var(--ink3);}
.heat-scale span{position:absolute;transform:translateX(-50%);}
.heat-note{font-size:11.5px;color:var(--ink2);line-height:1.7;margin:8px 0 0;}
.actions{display:flex;gap:10px;align-items:center;}
.btn-mini{width:auto;flex:0 0 auto;padding:9px 15px;font-size:13px;border-radius:11px;letter-spacing:0;}
.btn-ghost{flex:1;padding:13px;border:1.5px solid var(--line);border-radius:14px;background:#fff;color:var(--ink2);font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;}
.tip{font-size:11px;color:#B7BFCC;margin:0;}
.foot{font-size:11px;color:#B7BFCC;text-align:center;margin:18px 0 0;line-height:1.8;}
.toast{position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(20px);background:#333A45;color:#fff;font-size:13px;padding:10px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:all .25s;z-index:9;}
.toast.show{opacity:1;transform:translateX(-50%);}

/* ===== 交互微动效：全部叠加层，元素默认可见，不靠动画撑尺寸 ===== */
.opt{transition:border-color .18s,background .18s,transform .12s;}
.opt:active{transform:scale(.975);}
.opt.on{animation:optPick .34s cubic-bezier(.34,1.56,.64,1);}
@keyframes optPick{0%{transform:scale(.975)}55%{transform:scale(1.02)}100%{transform:scale(1)}}
.opt.on .k{animation:kPop .36s cubic-bezier(.34,1.56,.64,1);}
@keyframes kPop{0%{transform:scale(.55)}60%{transform:scale(1.2)}100%{transform:scale(1)}}
.btn-p{transition:transform .15s,box-shadow .22s,background .2s,opacity .2s;}
.btn-p:disabled{opacity:.42;cursor:not-allowed;}
.btn-ghost{transition:border-color .2s,background .2s,transform .12s;}
.btn-ghost:active{transform:scale(.98);}
@media (hover:hover){
  .btn-p:not(:disabled):hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(245,166,35,.3);}
  .btn-ghost:hover{border-color:#F5C463;background:#FFFCF4;}
  .opt:hover{border-color:#F5C463;}
}
.r-name,.r-hl,.r-punch,.r-tags,.milk-hero{will-change:transform,opacity;}

/* 抽卡过场：0.6s 快速轮播 16 只 → 定格到真实结果 */
.rv-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:250px;}
.rv-ring{width:158px;height:158px;border-radius:50%;background:#FFF8E8;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px #FFFDF6 inset;}
.rv-face{width:150px;height:150px;display:flex;align-items:center;justify-content:center;}
.rv-face img{width:140px;height:140px;object-fit:contain;filter:drop-shadow(0 6px 16px rgba(40,50,80,.18));animation:rvSpin .44s ease-out;}
@keyframes rvSpin{from{opacity:.3;transform:scale(.8) rotate(-5deg)}to{opacity:1;transform:none}}
.rv-face.rv-lock img{animation:rvLock .46s cubic-bezier(.34,1.56,.64,1);}
@keyframes rvLock{0%{transform:scale(.58) rotate(-12deg);opacity:.35}62%{transform:scale(1.14) rotate(4deg);opacity:1}100%{transform:none}}
.rv-txt{font-size:14px;color:var(--ink2);font-weight:600;letter-spacing:1px;margin:16px 0 0;}
.rv-dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--amber);margin:0 3px;animation:rvDot .95s infinite ease-in-out;}
.rv-dots i:nth-child(2){animation-delay:.16s}.rv-dots i:nth-child(3){animation-delay:.32s}
@keyframes rvDot{0%,60%,100%{opacity:.25;transform:translateY(0)}30%{opacity:1;transform:translateY(-5px)}}

/* ★ reduced-motion 全量兜底：所有动效瞬间结束，元素保持默认可见 */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;}
  .page{animation:none;}
  .bar i{transition:none;}
  .heat-pin{transition:none;}
  .rv-face img,.rv-face.rv-lock img{animation:none;}
}
</style>
</head>
<body>
<div class="wrap">

  <section class="page" id="pg-cover">
    <div class="card">
      <div class="badge" id="badge"></div>
      <h1>测测你是<br>奶龙家族的谁</h1>
      <p class="sub">族谱 16 只奶系生物 · 抽象发疯 · 玩玩一乐</p>
      <div class="zoo" id="zoo"></div>
      <div class="legend" id="legend"></div>
      <p class="intro">15 道题，测完直接告诉你你是族谱里的哪一只。<br>不用想太多，凭直觉选就行——反正大家都是来发疯的。</p>
      <button class="btn-p" id="btn-start">开始测试</button>
      <p class="note">无广告 · 不收集任何信息 · 玩玩一乐</p>
    </div>
  </section>

  <section class="page hidden" id="pg-quiz">
    <div class="card">
      <div class="q-head">
        <span>QUESTION <b id="q-idx">01</b> / 15</span>
        <span id="q-topic"></span>
      </div>
      <div class="bar"><i id="q-bar" style="width:6%"></i></div>
      <h2 class="q-title" id="q-title"></h2>
      <div id="q-opts"></div>
      <div class="q-foot">
        <button class="link-btn hidden" id="btn-prev">← 上一题</button>
        <button class="btn-p" id="btn-next" style="width:auto;padding:12px 34px;" disabled>下一题</button>
      </div>
    </div>
  </section>

  <section class="page hidden" id="pg-reveal">
    <div class="card">
      <div class="rv-wrap">
        <div class="rv-ring"><div class="rv-face" id="rv-face"></div></div>
        <p class="rv-txt">正在翻族谱</p>
        <div class="rv-dots"><i></i><i></i><i></i></div>
      </div>
      <p class="note">别眨眼，就一下</p>
    </div>
  </section>

  <section class="page hidden" id="pg-result">
    <div class="card">
      <div class="milk-hero" id="milk-hero"></div>
      <div class="r-kicker">你是奶龙家族里的</div>
      <div class="r-name" id="r-name"></div>
      <div class="r-en" id="r-en"></div>
      <div class="r-tags" id="r-tags"></div>
      <p class="r-hl" id="r-hl"></p>
      <p class="r-punch" id="r-bad"></p>
      <div class="heat">
        <div class="heat-head"><span>家族热度榜 · 从冷到热</span><b id="r-rank"></b></div>
        <div class="heat-bar"><span class="heat-pin" id="r-pin"></span></div>
        <div class="heat-scale">
          <span style="left:10%">冷</span><span style="left:30%">温</span><span style="left:50%">热</span><span style="left:70%">烫</span><span style="left:90%">火山</span>
        </div>
        <p class="heat-note" id="r-heatnote"></p>
      </div>
      <div class="actions">
        <button class="btn-p btn-mini" id="btn-restart">换一个测测</button>
        <button class="btn-ghost" id="btn-copy">复制结果</button>
      </div>
    </div>
    <p class="foot">本测试为趣味向二创，与各形象原作者及版权方无关。<br>题目与文案均为原创，族谱形象仅为致敬。</p>
  </section>

</div>
<div class="toast" id="toast"></div>

const REDUCED = (function(){
  try { return !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches); }
  catch(e){ return false; }
})();
const REAL = (function(){
  if(REDUCED) return false;
  try { return typeof document.createElement('canvas').getContext === 'function'; }
  catch(e){ return false; }
})();
function fx(el, kfs, opt){
  if(!REAL || !FX.micro || !el || typeof el.animate !== 'function') return;
  try { el.animate(kfs, opt); } catch(e){}
}
function fireConfetti(opt){
  if(!REAL || !FX.confetti || typeof window.confetti !== 'function') return;
  try { window.confetti(Object.assign({disableForReducedMotion:true}, opt)); } catch(e){}
}
function countUp(el, to, dur){
  if(!REAL || !FX.micro || !el || typeof requestAnimationFrame !== 'function') return;
  const final = '第 ' + to + ' / 16 位';
  const t0 = performance.now();
  let done = false;
  /* 关键：异步启动，同步返回时 textContent 仍是终值。
     rAF 若因切后台被暂停，兜底定时器也会把终值强制写回，绝不卡在中间数字。 */
  function step(t){
    if(done) return;
    const p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
    el.textContent = '第 ' + Math.max(1, Math.round(to * e)) + ' / 16 位';
    if(p < 1) requestAnimationFrame(step);
    else { done = true; el.textContent = final; }
  }
  requestAnimationFrame(step);
  setTimeout(function(){ if(!done){ done = true; el.textContent = final; } }, dur + 260);
}
